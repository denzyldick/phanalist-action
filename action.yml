name: "Phanalist"
description: "Performant static analyzer for PHP, which is extremely easy to use. It helps you catch common mistakes in your PHP code."
author: Denzyl Dick
branding:
  icon: alert-triangle
  color: purple
inputs:
  src:
    description: "Path to project sources."
    required: true
    default: ".src/"
  include_rule_descriptions:
    description: "Append each rule's full documentation to inline pull request annotations."
    required: false
    default: "true"
runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v4
    - name: Download phanalist.
      shell: bash
      run: curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/denzyldick/phanalist/main/bin/init.sh | sh
    - name: Display version
      shell: bash
      run: /home/runner/phanalist --help
    - name: Running phanalist
      continue-on-error: true
      shell: bash
      run: /home/runner/phanalist --src=${GITHUB_WORKSPACE}${INPUT_SRC} --output-format=sarif | tee result.sarif
    - name: Prepare SARIF
      shell: bash
      env:
        INCLUDE_RULE_DESCRIPTIONS: ${{ inputs.include_rule_descriptions }}
      run: |
        if [ "${INCLUDE_RULE_DESCRIPTIONS}" = "true" ]; then
          jq '
            .runs[] |= (
              . as $run
              | .results |= map(
                  . as $result
                  | ($run.tool.driver.rules[] | select(.id == $result.ruleId) | .fullDescription.text) as $desc
                  | if ($desc // "") == "" then .
                    elif (.message.text // "" | contains($desc)) then .
                    else
                      .message as $message
                      | .message.text = (($message.text // "") + "\n\n" + $desc)
                      | .message.markdown = (($message.markdown // $message.text // "") + "\n\n" + $desc)
                    end
                )
            )
          ' result.sarif > results.sarif
        else
          cp result.sarif results.sarif
        fi
    - name: Upload SARIF file
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: results.sarif
