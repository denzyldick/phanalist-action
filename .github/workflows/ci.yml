name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          src: tests/fixtures
      - name: Verify SARIF output
        shell: bash
        run: |
          set -euo pipefail
          sarif="${RUNNER_TEMP}/phanalist-results.sarif"
          test -s "${sarif}"
          jq -e '.runs[0].results | length > 0' "${sarif}"
